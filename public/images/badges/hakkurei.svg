<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 31" width="88" height="31">
  <defs>
    <!-- Retro pixel font style -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');
      .pixel-text {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #FFD700;
        text-shadow: 1px 1px 0px #4A0000;
      }
      .sub-text {
        font-family: 'VT323', 'Courier New', monospace;
        font-size: 8px;
        fill: #FFFFFF;
        letter-spacing: 0.5px;
      }
      .glow-rect {
        animation: borderGlow 2s infinite alternate;
      }
      @keyframes borderGlow {
        0% { stroke: #FFD700; }
        100% { stroke: #FF4500; }
      }
    </style>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="50%" stop-color="#4A0000" />
      <stop offset="100%" stop-color="#2D0000" />
    </linearGradient>
    <pattern id="grid" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="none" />
      <path d="M 2 0 L 0 0 0 2" fill="none" stroke="#FFFFFF" stroke-width="0.15" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="88" height="31" fill="url(#bg-grad)" />
  <rect width="88" height="31" fill="url(#grid)" />

  <!-- Shinto Border (Stiff retro outset look) -->
  <rect x="0.5" y="0.5" width="87" height="30" fill="none" stroke="#FFD700" stroke-width="1" class="glow-rect" />
  <rect x="1.5" y="1.5" width="85" height="28" fill="none" stroke="#000000" stroke-width="1" opacity="0.4" />

  <!-- Left: Shinto Torii Gate -->
  <g transform="translate(4, 6)">
    <!-- Pillars -->
    <rect x="2" y="4" width="1.5" height="15" fill="#FF4500" stroke="#000000" stroke-width="0.5" />
    <rect x="11.5" y="4" width="1.5" height="15" fill="#FF4500" stroke="#000000" stroke-width="0.5" />
    <!-- Center gate piece -->
    <rect x="5" y="4" width="5" height="2" fill="#FF4500" />
    <!-- Top Beam (笠木 - Kasagi) -->
    <path d="M 0 1 Q 7 -1 15 1 L 15 3.5 Q 7 1.5 0 3.5 Z" fill="#FF4500" stroke="#000000" stroke-width="0.5" />
    <!-- Second Beam (貫 - Nuki) -->
    <rect x="1" y="5" width="13" height="1.5" fill="#FF4500" stroke="#000000" stroke-width="0.5" />
    <!-- Top Black Beam Cover -->
    <path d="M 0 0.5 Q 7 -1.5 15 0.5 L 15 1.5 Q 7 -0.5 0 1.5 Z" fill="#1A1A1A" />
    <!-- Base blocks -->
    <rect x="1" y="17.5" width="3.5" height="1.5" fill="#333333" />
    <rect x="10.5" y="17.5" width="3.5" height="1.5" fill="#333333" />
  </g>

  <!-- Right: Blinking/Neon Text -->
  <text x="24" y="16" class="pixel-text">HAKUREI</text>
  <text x="24" y="25" class="sub-text">★ SHRINE Maiden ★</text>

  <!-- Decorative small star -->
  <path d="M 80 5 L 81 7 L 83 7.5 L 81.5 9 L 82 11 L 80 10 L 78 11 L 78.5 9 L 77 7.5 L 79 7 Z" fill="#FFD700">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
  </path>
</svg>
